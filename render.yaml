services:
  - type: web
    name: austin-sports-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Optional. Enables the natural-language search bar. Set any number
      # in the Render dashboard (Environment tab); the search bar's "Auto"
      # option chains through whichever are set, free ones (Gemini, Groq,
      # Mistral) first, and without any, search falls back to plain
      # keyword matching. sync: false keeps the values out of this
      # committed file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
