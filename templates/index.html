<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Austin Pickup: find a place to play in Austin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="wordmark">
    <span class="wordmark-text">Austin Pickup</span>
  </div>
  <p class="tagline">Courts, fields, trails and parks around Austin, where locals actually go.</p>
</header>

<div class="layout">
  <aside class="legend" id="legend">
    <div class="legend-section">
      <h2>Ask</h2>
      <form class="search-row" id="search-form">
        <input type="text" id="search-input" placeholder="e.g. basketball near downtown" autocomplete="off">
        <button type="submit" class="search-btn">Search</button>
      </form>
      <div class="provider-row" id="provider-row" hidden>
        <label for="provider-select">Using</label>
        <select id="provider-select"></select>
      </div>
      <p class="hint" id="search-status"></p>
    </div>

    <div class="legend-section">
      <h2>Play</h2>
      <ul class="filter-list" id="filter-list">
        <li><button class="filter-btn active" data-group="All">All spots</button></li>
        {% for group in groups %}
        <li><button class="filter-btn" data-group="{{ group }}">{{ group }}</button></li>
        {% endfor %}
      </ul>
    </div>

    <div class="legend-section">
      <h2>Near you</h2>
      <button class="locate-btn" id="locate-btn">Use my location</button>
      <div class="radius-row" id="radius-row" hidden>
        <label for="radius-input">Within</label>
        <select id="radius-input">
          <option value="1">1 mi</option>
          <option value="2" selected>2 mi</option>
          <option value="5">5 mi</option>
          <option value="10">10 mi</option>
        </select>
        <button class="clear-btn" id="clear-locate-btn" title="Clear location">×</button>
      </div>
      <p class="hint" id="locate-status"></p>
    </div>

    <div class="legend-section legend-count">
      <p id="result-count">Loading spots…</p>
      {% if using_sample %}
      <p class="hint sample-warning">Showing sample data. Run the extraction scripts to load the real Austin dataset.</p>
      {% endif %}
    </div>
  </aside>

  <main class="map-wrap">
    <div class="view-toggle" id="view-toggle">
      <button type="button" class="view-btn active" data-view="map">Map</button>
      <button type="button" class="view-btn" data-view="list">List</button>
    </div>
    <div id="map"></div>
    <div id="list-view" class="list-view" hidden></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
